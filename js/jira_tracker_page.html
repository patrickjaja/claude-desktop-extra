.cmt-body { grid-column: 2; margin-top: 8px; min-width: 0; }
.more-comments { margin-top: 4px; font-size: 13px; }
.tablewrap { overflow-x: auto; margin: 8px 0 12px; }
.adf table { border-collapse: collapse; }
.adf th, .adf td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; }
.adf th { background: var(--field); font-weight: 600; }
.adf th > p:last-child, .adf td > p:last-child { margin-bottom: 0; }
.board-top { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
.board-top .board-title { margin: 0; }
.board-top .backlog-link { margin-left: auto; font-size: 13px; }
.boardwrap { overflow-x: auto; padding-bottom: 8px; }
.board { display: flex; gap: 12px; align-items: flex-start; }
.column { flex: 0 0 260px; min-width: 260px; min-height: 120px; background: var(--field); border-radius: 12px; padding: 8px; }
.column.drop { box-shadow: inset 0 0 0 2px var(--accent); }
.column h3 { display: flex; align-items: center; gap: 8px; margin: 4px 4px 10px; font-size: 15px; font-weight: 520; line-height: 20px; }
.card { position: relative; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; cursor: grab; touch-action: none; user-select: none; outline: none; }
.card:hover { border-color: color-mix(in srgb, var(--fg) 25%, transparent); }
.card:focus-visible { box-shadow: var(--cds-focus-shadow, 0 0 0 2px var(--accent)); }
.card.dragging { opacity: .35; }
.card.pending { opacity: .6; }
.card.ghost { position: fixed; z-index: 20; pointer-events: none; margin: 0; opacity: .95; box-shadow: var(--cds-shadow-popover, 0 8px 24px rgba(0,0,0,.25)); }
.card .ctop { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.card .ctop svg { color: var(--faint); }
.card .ctop .more { margin-left: auto; width: 24px; height: 24px; opacity: 0; }
.card:hover .more, .card:focus-within .more, .card .more[aria-expanded="true"] { opacity: 1; }
.card .csum { margin: 6px 0 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .cfoot { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.card .cfoot .avatar { margin-left: auto; }
.card .cstatus { height: 20px; padding: 0 6px; font-size: 11px; line-height: 20px; border-radius: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="cdb-jira-root">
  <header id="head" class="head">
    <button id="close" class="icon" type="button" aria-label="Close the Jira page" title="Close" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    <div class="col">
      <div class="head-title"><h1 class="title">Jira</h1></div>
      <div class="head-bar">
        <div id="tabs" class="tabs" role="tablist" aria-label="Tickets to show"></div>
        <span class="divider" aria-hidden="true"></span>
        <div class="seg" role="tablist" aria-label="View">
          <button id="view-list" type="button" role="tab" aria-selected="true">List</button>
          <button id="view-board" type="button" role="tab" aria-selected="false">Board</button>
        </div>
        <div class="head-tools">
          <label id="searchbox" class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><input id="jql" type="text" placeholder="Search or JQL" aria-label="Search tickets or type JQL" maxlength="2000"></label>
          <button id="filter" class="icon" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Project: All projects" title="Project"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M4.5 8h7M6.5 12h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
          <button id="sort" class="icon" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Sort: Updated" title="Sort"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M5 13l-2.5-2.5M5 13l2.5-2.5M11 13V3M11 3L8.5 5.5M11 3l2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button id="query" class="primary" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Query actions"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Query<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 6.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>
    </div>
  </header>
  <main id="main">
    <section id="results" aria-live="polite"></section>
    <aside id="detail" hidden></aside>
  </main>
</div>
<script>/*__CDB_JIRA_SCRIPT__*/</script>
</body>
