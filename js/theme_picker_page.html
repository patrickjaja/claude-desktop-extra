<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Themes</title>
<style>
/*
 * Theme picker chrome. Deliberately achromatic: 84+ palettes are on screen at
 * once, so the only color the window carries is --accent, which is taken from
 * the palette you have selected. Everything else is neutral so the swatches
 * are the loudest thing on the page.
 */
:root{
  --ink-900:#0e0e11;
  --ink-800:#15151a;
  --ink-700:#1c1c23;
  --ink-600:#24242c;
  --line:#2c2c35;
  --fog-500:#75757f;
  --fog-400:#9a9aa5;
  --fog-100:#e9e9ef;
  --accent:#d97757;
  --sans:"Inter","Cantarell","Ubuntu","DejaVu Sans",system-ui,sans-serif;
  --mono:"JetBrains Mono","Fira Code","DejaVu Sans Mono","Liberation Mono",ui-monospace,monospace;
  --pad:22px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--ink-900);
  color:var(--fog-100);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
#app{display:flex;flex-direction:column;height:100%}

/* ---- header ---------------------------------------------------------- */
header{
  flex:0 0 auto;
  display:flex;
  align-items:baseline;
  gap:16px;
  flex-wrap:wrap;
  padding:20px var(--pad) 16px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(var(--ink-800),var(--ink-900));
}
h1{
  margin:0;
  font-size:19px;
  font-weight:620;
  letter-spacing:-0.01em;
}
.tally{
  font-family:var(--mono);
  font-size:11px;
  color:var(--fog-500);
  letter-spacing:0.04em;
  text-transform:uppercase;
}
.search{
  margin-left:auto;
  position:relative;
  flex:1 1 220px;
  max-width:320px;
  min-width:160px;
}
.search input{
  width:100%;
  padding:8px 12px 8px 30px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--ink-700);
  color:var(--fog-100);
  font-family:var(--mono);
  font-size:12px;
}
.search input::placeholder{color:var(--fog-500)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--fog-500);fill:none;stroke-width:2}

/* ---- overlay bar ----------------------------------------------------- */
/* themeOverlay merges one theme's tokens over whatever card is picked. It is
   invisible in the grid on its own, so it gets a bar of its own between the
   header and the sections: what is merged and how to stop it, or a select to
   start one. Hidden entirely when nothing is active and nothing could be. */
.overlay-bar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px 12px;
  padding:9px var(--pad);
  border-bottom:1px solid var(--line);
  background:var(--ink-800);
  font-size:12.5px;
  color:var(--fog-400);
}
.overlay-bar[hidden]{display:none}
.overlay-k{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:500;
  letter-spacing:0.13em;
  text-transform:uppercase;
  color:var(--accent);
}
.overlay-name{color:var(--fog-100);font-weight:600}
.overlay-note{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.overlay-bar select{
  padding:5px 8px;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--ink-700);
  color:var(--fog-100);
  font-family:var(--mono);
  font-size:11.5px;
  max-width:260px;
}
.overlay-bar select:focus{outline:none;border-color:var(--accent)}
.overlay-bar button{
  padding:5px 11px;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--ink-700);
  color:var(--fog-100);
  font:inherit;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}
.overlay-bar button:hover{border-color:#3a3a46;background:var(--ink-600)}
.overlay-bar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.overlay-bar button[disabled]{opacity:.45;cursor:default}
/* The picked card is not what is on screen while an overlay is merged over it;
   the badge next to its check mark says so. */
.card-ov{
  flex:0 0 auto;
  display:none;
  padding:0 6px;
  border:1px solid var(--accent);
  border-radius:20px;
  color:var(--accent);
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  line-height:15px;
}
.card[aria-pressed="true"][data-overlay="1"] .card-ov{display:inline-block}

/* ---- scroll body ----------------------------------------------------- */
main{flex:1 1 auto;overflow-y:auto;padding:6px var(--pad) 26px;scrollbar-width:thin;scrollbar-color:var(--ink-600) transparent}
section{margin-top:22px}
section[hidden]{display:none}
/* Gaming palettes are their own thing: a full-width rule sets them apart from the
   palettes above instead of relying on the eyebrow's trailing hairline alone. */
.section-split{margin-top:30px;padding-top:26px;border-top:1px solid var(--line)}
.eyebrow{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 0 12px;
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:500;
  letter-spacing:0.13em;
  text-transform:uppercase;
  color:var(--fog-400);
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.badge{
  padding:1px 7px;
  border-radius:20px;
  background:var(--ink-700);
  color:var(--fog-400);
  font-size:10px;
  letter-spacing:0.06em;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(236px,1fr));
  gap:12px;
}

/* ---- palette card ---------------------------------------------------- */
.card{
  display:flex;
  flex-direction:column;
  gap:9px;
  width:100%;
  padding:13px 13px 12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--ink-800);
  color:inherit;
  font:inherit;
  text-align:left;
  cursor:pointer;
  transition:border-color .14s ease,transform .14s ease,background-color .14s ease;
}
.card[hidden]{display:none}
.card:hover{background:var(--ink-700);border-color:#3a3a46;transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card[aria-pressed="true"]{
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent),0 6px 22px -12px var(--accent);
}
.card-head{display:flex;align-items:center;gap:8px}
.card-title{
  flex:1;
  min-width:0;
  font-size:14.5px;
  font-weight:600;
  letter-spacing:-0.005em;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.card-check{
  flex:0 0 auto;
  width:17px;height:17px;
  border-radius:50%;
  background:var(--accent);
  color:var(--ink-900);
  font-size:11px;
  font-weight:700;
  line-height:17px;
  text-align:center;
  opacity:0;
  transform:scale(.6);
  transition:opacity .16s ease,transform .16s ease;
}
.card[aria-pressed="true"] .card-check{opacity:1;transform:scale(1)}
.card-slug{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--fog-500);
  letter-spacing:0.02em;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.strips{display:flex;flex-direction:column;gap:5px}
.strip{
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 8px;
  border-radius:7px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.22),0 0 0 1px rgba(255,255,255,.05);
}
.strip-k{
  flex:0 0 auto;
  width:12px;
  margin-right:1px;
  font-family:var(--mono);
  font-size:9px;
  font-weight:600;
  letter-spacing:0.06em;
  opacity:.62;
}
.dot{flex:0 0 auto;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.28)}
.strip--stock{background:repeating-linear-gradient(115deg,var(--ink-700) 0 5px,var(--ink-600) 5px 10px);color:var(--fog-400)}
.strip--stock .strip-k{opacity:1}
.stock-note{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--fog-500)}

/* ---- states ---------------------------------------------------------- */
.notice{
  margin:20px 0 0;
  padding:14px 16px;
  border:1px solid var(--line);
  border-left:2px solid var(--accent);
  border-radius:8px;
  background:var(--ink-800);
  color:var(--fog-400);
  font-size:13px;
}
.notice strong{display:block;margin-bottom:4px;color:var(--fog-100);font-weight:600}
.notice code{font-family:var(--mono);font-size:12px;color:var(--fog-100)}
#empty[hidden],#error[hidden]{display:none}

/* ---- footer + toast -------------------------------------------------- */
footer{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px 14px;
  padding:11px var(--pad);
  border-top:1px solid var(--line);
  background:var(--ink-800);
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:0.03em;
  color:var(--fog-500);
}
footer > span{white-space:nowrap}
kbd{
  padding:1px 5px;
  border:1px solid var(--line);
  border-bottom-width:2px;
  border-radius:4px;
  background:var(--ink-700);
  color:var(--fog-400);
  font:inherit;
}
/* Floated clear of the footer flow: a long theme name must never reflow the
   keyboard hints out from under the reader. */
#toast{
  position:fixed;
  right:var(--pad);
  bottom:52px;
  max-width:calc(100% - 2 * var(--pad));
  padding:7px 13px;
  border-radius:20px;
  background:var(--accent);
  color:var(--ink-900);
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:0.01em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.85);
  pointer-events:none;
  opacity:0;
  transform:translateY(6px);
  transition:opacity .18s ease,transform .18s ease;
}
#toast.show{opacity:1;transform:none}
#toast.bad{background:#e0534f;color:#fff}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .card:hover{transform:none}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Themes</h1>
    <span class="tally" id="tally">loading</span>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      <input id="search" type="search" placeholder="Filter by name or slug" autocomplete="off" spellcheck="false" aria-label="Filter themes">
    </label>
  </header>

  <div class="overlay-bar" id="overlay-bar" role="region" aria-label="Theme overlay" hidden></div>

  <main id="main">
    <p class="notice" id="error" hidden></p>
    <p class="notice" id="empty" hidden></p>
    <section id="sec-stock" hidden>
      <h2 class="eyebrow">Stock</h2>
      <div class="grid" id="grid-stock"></div>
    </section>
    <section id="sec-custom" hidden>
      <h2 class="eyebrow">Your themes <span class="badge" id="count-custom">0</span></h2>
      <div class="grid" id="grid-custom"></div>
    </section>
    <section id="sec-gaming" class="section-split" hidden>
      <h2 class="eyebrow">Gaming <span class="badge" id="count-gaming">0</span></h2>
      <div class="grid" id="grid-gaming"></div>
    </section>
    <section id="sec-common" hidden>
      <h2 class="eyebrow">Common <span class="badge" id="count-common">0</span></h2>
      <div class="grid" id="grid-common"></div>
    </section>
  </main>

  <footer>
    <span><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>T</kbd> toggles this window</span>
    <span><kbd>/</kbd> filter &middot; <kbd>Enter</kbd> apply &middot; <kbd>Esc</kbd> close</span>
    <span>spinner shape switches with the theme</span>
    <span id="toast" role="status" aria-live="polite"></span>
  </footer>
</div>

<script>
"use strict";
(function () {
  var SWATCH = ["--bg-000", "--text-000", "--accent-brand", "--accent-pro-100", "--danger-100", "--warning-100", "--success-100"];
  var SECTIONS = ["custom", "gaming", "common"];
  var LABEL = { custom: "Your themes", gaming: "Gaming", common: "Common" };
  var state = { entries: [], active: null, cards: [], overlay: null, overlays: [] };
  var toastTimer = null;

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  // Theme tokens are authored as "H S% L%" (CSS Color 4 shorthand); --claude-*
  // tokens are plain hex. Normalize both to something a style attribute accepts.
  function pct(x) {
    x = String(x).trim();
    return /%$/.test(x) ? x : parseFloat(x) + "%";
  }
  function color(v, fallback) {
    if (typeof v !== "string") return fallback;
    v = v.trim();
    if (!v) return fallback;
    if (v.charAt(0) === "#" || /^(rgb|hsl|oklch|color)a?\(/i.test(v)) return v;
    var p = v.split(/[\s,]+/);
    if (p.length < 3) return fallback;
    var h = parseFloat(p[0]);
    if (isNaN(h)) return fallback;
    return "hsl(" + h + "," + pct(p[1]) + "," + pct(p[2]) + ")";
  }

  function strip(vars, key) {
    var row = el("span", "strip");
    row.style.background = color(vars && vars["--bg-100"], "#1c1c23");
    var k = el("span", "strip-k", key);
    k.style.color = color(vars && vars["--text-000"], "#9a9aa5");
    row.appendChild(k);
    for (var i = 0; i < SWATCH.length; i++) {
      var dot = el("span", "dot");
      dot.style.background = color(vars && vars[SWATCH[i]], "#3a3a46");
      row.appendChild(dot);
    }
    return row;
  }

  function card(entry) {
    var b = el("button", "card");
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.dataset.name = entry.name;
    b.dataset.hay = (entry.displayName + " " + entry.name + " " + entry.source +
                     " " + (entry.category || "")).toLowerCase();

    var head = el("span", "card-head");
    head.appendChild(el("span", "card-title", entry.displayName));
    head.appendChild(el("span", "card-ov", "overlay"));
    head.appendChild(el("span", "card-check", "✓"));
    b.appendChild(head);
    b.appendChild(el("span", "card-slug", entry.name || "stock"));

    var strips = el("span", "strips");
    if (entry.source === "stock") {
      var rows = [["D", "Claude's own dark"], ["L", "Claude's own light"]];
      for (var r = 0; r < rows.length; r++) {
        var s = el("span", "strip strip--stock");
        s.appendChild(el("span", "strip-k", rows[r][0]));
        s.appendChild(el("span", "stock-note", rows[r][1]));
        strips.appendChild(s);
      }
    } else {
      strips.appendChild(strip(entry.dark, "D"));
      strips.appendChild(strip(entry.light, "L"));
    }
    b.appendChild(strips);

    b.addEventListener("click", function () { pick(entry.name); });
    return b;
  }

  function accentOf(name) {
    for (var i = 0; i < state.entries.length; i++) {
      var e = state.entries[i];
      if (e.name === name) {
        return color((e.dark && e.dark["--accent-brand"]) || (e.light && e.light["--accent-brand"]), null);
      }
    }
    return null;
  }

  function paintAccent() {
    var a = state.active ? accentOf(state.active) : null;
    document.documentElement.style.setProperty("--accent", a || "#d97757");
  }

  function markActive() {
    for (var i = 0; i < state.cards.length; i++) {
      var c = state.cards[i];
      var on = (c.dataset.name || "") === (state.active || "");
      c.setAttribute("aria-pressed", on ? "true" : "false");
      c.setAttribute("data-overlay", state.overlay ? "1" : "0");
    }
  }

  // ---- themeOverlay -----------------------------------------------------
  // The bridge grew these three calls with the overlay feature; an older preload
  // (or a stub without them) means no bar, never an error.
  function overlayApi() {
    var t = window.cdbThemes;
    if (!t || typeof t.overlay !== "function" || typeof t.overlays !== "function" ||
        typeof t.setOverlay !== "function") return null;
    return t;
  }
  function overlayLabel(name) {
    var i;
    for (i = 0; i < state.overlays.length; i++) {
      if (state.overlays[i].name === name) return state.overlays[i].displayName || name;
    }
    for (i = 0; i < state.entries.length; i++) {
      if (state.entries[i].name === name) return state.entries[i].displayName || name;
    }
    return name;
  }
  // Both reads at once; a build that answers "not supported" leaves both empty,
  // which renders as no bar.
  function fetchOverlay() {
    var t = overlayApi();
    if (!t) return Promise.resolve();
    return Promise.all([t.overlay(), t.overlays()]).then(function (res) {
      var o = res[0], l = res[1];
      state.overlay = (o && o.ok && o.overlay) ? String(o.overlay) : null;
      state.overlays = (l && l.ok && Array.isArray(l.entries)) ? l.entries : [];
    }, function () {
      state.overlay = null;
      state.overlays = [];
    });
  }
  function setOverlay(name) {
    var t = overlayApi();
    if (!t) return;
    var bar = $("overlay-bar");
    var buttons = bar.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) buttons[i].disabled = true;
    t.setOverlay(name).then(function (r) {
      if (!r || !r.ok) {
        toast((r && r.error) || "Could not change the overlay", true);
        renderOverlay();
        return;
      }
      fetchOverlay().then(function () {
        renderOverlay();
        markActive();
        var where = r.saved || "claude-desktop-extra.jsonc";
        toast(state.overlay ? "Overlay " + overlayLabel(state.overlay) + " on - saved to " + where
                            : "Overlay off - saved to " + where);
      });
    }, function (e) {
      toast("Could not reach the theme engine: " + (e && e.message), true);
      renderOverlay();
    });
  }
  function renderOverlay() {
    var bar = $("overlay-bar");
    bar.textContent = "";
    if (state.overlay) {
      bar.appendChild(el("span", "overlay-k", "Overlay"));
      bar.appendChild(el("span", "overlay-name", overlayLabel(state.overlay)));
      bar.appendChild(el("span", "overlay-note", "merges its colors over every theme you pick"));
      var off = el("button", null, "Turn off");
      off.type = "button";
      off.id = "overlay-off";
      off.addEventListener("click", function () { setOverlay(""); });
      bar.appendChild(off);
      bar.hidden = false;
      return;
    }
    if (!state.overlays.length) {
      bar.hidden = true;
      return;
    }
    bar.appendChild(el("span", "overlay-k", "Overlay"));
    var sel = el("select");
    sel.id = "overlay-pick";
    sel.setAttribute("aria-label", "Theme to merge over the picked theme");
    var none = el("option", null, "none");
    none.value = "";
    sel.appendChild(none);
    for (var i = 0; i < state.overlays.length; i++) {
      var o = state.overlays[i];
      var opt = el("option", null, o.displayName || o.name);
      opt.value = o.name;
      sel.appendChild(opt);
    }
    bar.appendChild(sel);
    var go = el("button", null, "Apply");
    go.type = "button";
    go.id = "overlay-apply";
    go.disabled = true;
    sel.addEventListener("change", function () { go.disabled = !sel.value; });
    go.addEventListener("click", function () { if (sel.value) setOverlay(sel.value); });
    bar.appendChild(go);
    bar.hidden = false;
  }

  function toast(msg, bad) {
    var t = $("toast");
    t.textContent = msg;
    t.className = "show" + (bad ? " bad" : "");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ""; }, 3600);
  }

  function fail(title, detail) {
    var box = $("error");
    box.hidden = false;
    box.textContent = "";
    box.appendChild(el("strong", null, title));
    box.appendChild(document.createTextNode(detail || ""));
    $("tally").textContent = "unavailable";
  }

  function pick(name) {
    if (!window.cdbThemes) return;
    window.cdbThemes.apply(name).then(function (r) {
      if (!r || !r.ok) {
        toast((r && r.error) || "Could not apply that theme", true);
        return;
      }
      state.active = name || null;
      markActive();
      paintAccent();
      var where = (r && r.saved) || "claude-desktop-extra.jsonc";
      var shown = name || "stock";
      for (var i = 0; i < state.entries.length; i++) {
        if (state.entries[i].name === name) { shown = state.entries[i].displayName; break; }
      }
      toast(name ? "Applied " + shown + " - saved to " + where
                 : "Restored Claude's palette - saved to " + where);
    }, function (e) {
      toast("Could not reach the theme engine: " + (e && e.message), true);
    });
  }

  function filter(q) {
    q = q.trim().toLowerCase();
    var shown = 0;
    var perSection = { custom: 0, gaming: 0, common: 0, stock: 0 };
    for (var i = 0; i < state.cards.length; i++) {
      var c = state.cards[i];
      var hit = !q || c.dataset.hay.indexOf(q) >= 0;
      c.hidden = !hit;
      if (hit) { shown++; perSection[c.dataset.source]++; }
    }
    for (var s = 0; s < SECTIONS.length; s++) {
      var key = SECTIONS[s];
      var sec = $("sec-" + key);
      if (!sec) continue;
      sec.hidden = perSection[key] === 0;
      var badge = $("count-" + key);
      if (badge) badge.textContent = String(perSection[key]);
    }
    var stock = $("sec-stock");
    if (stock) stock.hidden = perSection.stock === 0;
    var empty = $("empty");
    if (shown === 0) {
      empty.hidden = false;
      empty.textContent = "";
      empty.appendChild(el("strong", null, "Nothing matches “" + q + "”"));
      empty.appendChild(document.createTextNode("Search a family (catppuccin, gruvbox, rose-pine), a color, or a slug."));
    } else {
      empty.hidden = true;
    }
  }

  // 2D movement across the visible cards: left/right walk the flow, up/down jump
  // to the nearest card on the neighbouring row.
  function visible() {
    return state.cards.filter(function (c) { return !c.hidden && c.offsetParent !== null; });
  }
  function move(from, dir) {
    var vis = visible();
    var i = vis.indexOf(from);
    if (i < 0) return null;
    if (dir === "next") return vis[Math.min(i + 1, vis.length - 1)];
    if (dir === "prev") return vis[Math.max(i - 1, 0)];
    var top = from.offsetTop;
    var left = from.offsetLeft;
    var best = null;
    var bestDx = Infinity;
    for (var n = 0; n < vis.length; n++) {
      var c = vis[n];
      var below = c.offsetTop > top + 4;
      var above = c.offsetTop < top - 4;
      if (dir === "down" ? !below : !above) continue;
      if (best) {
        if (dir === "down" ? c.offsetTop > best.offsetTop : c.offsetTop < best.offsetTop) continue;
      }
      var dx = Math.abs(c.offsetLeft - left);
      if (!best || c.offsetTop !== best.offsetTop || dx < bestDx) {
        best = c;
        bestDx = dx;
      }
    }
    return best;
  }

  document.addEventListener("keydown", function (ev) {
    var k = ev.key;
    if (k === "Escape" || (ev.ctrlKey && ev.shiftKey && k && k.toLowerCase() === "t")) {
      ev.preventDefault();
      if (window.cdbThemes && window.cdbThemes.close) window.cdbThemes.close();
      return;
    }
    var search = $("search");
    if (k === "/" && document.activeElement !== search) {
      ev.preventDefault();
      search.focus();
      search.select();
      return;
    }
    if (document.activeElement === search) {
      if (k === "ArrowDown") {
        var first = visible()[0];
        if (first) { ev.preventDefault(); first.focus(); }
      }
      return;
    }
    var cur = document.activeElement;
    if (!cur || !cur.classList || !cur.classList.contains("card")) return;
    var dir = k === "ArrowRight" ? "next" : k === "ArrowLeft" ? "prev"
            : k === "ArrowDown" ? "down" : k === "ArrowUp" ? "up" : null;
    if (!dir) return;
    var target = move(cur, dir);
    if (target) {
      ev.preventDefault();
      target.focus();
      target.scrollIntoView({ block: "nearest" });
    }
  });

  $("search").addEventListener("input", function (ev) { filter(ev.target.value); });

  // A theme's SOURCE is its resolution tier (custom > builtin > community); its
  // CATEGORY is how it is grouped on screen. Gaming palettes ship as built-ins but
  // get their own separated section - and a gaming-category theme from any source
  // (a community palette, or one of your own) lands there too. Built-in and
  // community palettes share the "Common" section: which of the two a palette
  // ships as is a packaging detail, not a reason to look in a different list.
  function bucketOf(entry) {
    if (entry.source === "stock") return "stock";
    if (entry.category === "gaming") return "gaming";
    if (entry.source === "custom") return "custom";
    return "common";
  }

  function render() {
    var buckets = { stock: [], custom: [], gaming: [], common: [] };
    for (var i = 0; i < state.entries.length; i++) {
      var e = state.entries[i];
      var b = bucketOf(e);
      if (buckets[b]) buckets[b].push(e);
    }
    var keys = ["stock"].concat(SECTIONS);
    for (var s = 0; s < keys.length; s++) {
      var key = keys[s];
      var grid = $("grid-" + key);
      var sec = $("sec-" + key);
      if (!grid || !sec) continue;
      var list = buckets[key];
      sec.hidden = list.length === 0;
      var badge = $("count-" + key);
      if (badge) badge.textContent = String(list.length);
      for (var n = 0; n < list.length; n++) {
        var c = card(list[n]);
        c.dataset.source = key;
        grid.appendChild(c);
        state.cards.push(c);
      }
    }
    var n2 = state.entries.length - 1;
    $("tally").textContent = n2 + " palettes";
    renderOverlay();
    markActive();
    paintAccent();
  }

  function boot() {
    if (!window.cdbThemes) {
      fail("The theme bridge did not load",
           "Nothing was exposed on this page, so it cannot read or change themes. Restart Claude Desktop, and if it happens again check ~/.config/Claude/logs/claude-patches.log.");
      return;
    }
    Promise.all([window.cdbThemes.list(), window.cdbThemes.active()]).then(function (res) {
      var l = res[0];
      var a = res[1];
      if (!l || !l.ok) {
        fail("The theme engine is not available",
             (l && l.error) || "The custom-themes patch did not install its registry in this build.");
        return;
      }
      state.entries = [{ name: "", displayName: "Claude default", source: "stock" }].concat(l.entries || []);
      state.active = (a && a.ok) ? (a.name || null) : null;
      return fetchOverlay().then(function () {
        render();
        var first = state.cards.filter(function (c) { return c.getAttribute("aria-pressed") === "true"; })[0];
        (first || $("search")).focus();
      });
    }, function (e) {
      fail("Could not reach the theme engine", (e && e.message) || "");
    });
  }

  boot();
})();
</script>
</body>
</html>
